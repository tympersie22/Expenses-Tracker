name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: money_well_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/money_well_test
      APP_ORIGIN: http://localhost:3120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:localization
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:api
      - name: Prove populated backup recovery
        env:
          RESTORE_ADMIN_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/postgres
        run: npm run test:recovery
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
  ios:
    runs-on: macos-15
    env:
      DATABASE_URL: postgresql://localhost:5432/money_well_ui_test
      APP_ORIGIN: http://localhost:3120
      PORT: 3120
      HOSTNAME: "::"
      REQUIRE_EMAIL_VERIFICATION: "false"
      EMAIL_DELIVERY_MODE: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL
        run: |
          brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix postgresql@16)/bin/initdb" -D /tmp/expenses-tracker-postgres
          "$(brew --prefix postgresql@16)/bin/pg_ctl" -D /tmp/expenses-tracker-postgres -l /tmp/expenses-tracker-postgres.log start
          "$(brew --prefix postgresql@16)/bin/createdb" money_well_ui_test
      - name: Create temporary test secrets
        run: |
          APP_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          RATE_LIMIT_SALT="$(openssl rand -hex 32)"
          echo "::add-mask::$APP_ENCRYPTION_KEY"
          echo "::add-mask::$RATE_LIMIT_SALT"
          echo "APP_ENCRYPTION_KEY=$APP_ENCRYPTION_KEY" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_SALT=$RATE_LIMIT_SALT" >> "$GITHUB_ENV"
      - name: Start application API
        run: |
          npm ci
          npm run db:migrate
          npm run build
          npm start > /tmp/expenses-tracker-api.log 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:3120/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/expenses-tracker-api.log
          exit 1
      - name: Choose simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run iOS unit tests
        run: |
          xcodebuild -project ios/ExpensesTracker.xcodeproj -scheme ExpensesTracker -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/expenses-tracker-ios-ci test -only-testing:ExpensesTrackerTests
      - name: Run secure-session UI test
        run: |
          xcodebuild -project ios/ExpensesTracker.xcodeproj -scheme ExpensesTracker -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/expenses-tracker-ios-session-ci test -only-testing:ExpensesTrackerUITests/ExpensesTrackerUITests/testLoginPersistsSecureSession
      - name: Run ledger persistence UI test
        run: |
          xcodebuild -project ios/ExpensesTracker.xcodeproj -scheme ExpensesTracker -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/expenses-tracker-ios-ledger-ci test -only-testing:ExpensesTrackerUITests/ExpensesTrackerUITests/testRealAccountAndTransactionSurviveRelaunch
      - name: Validate release archive configuration
        run: |
          EXPENSES_TRACKER_API_URL=https://staging.example.invalid EXPENSES_TRACKER_PUBLIC_URL=https://staging.example.invalid bash ios/scripts/archive-release.sh validate
