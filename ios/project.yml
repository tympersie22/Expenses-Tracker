name: ExpensesTracker
configs:
  Debug: debug
  Release: release
options:
  bundleIdPrefix: com.expensestracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ExpensesTracker:
    type: application
    platform: iOS
    sources: [ExpensesTracker]
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    preBuildScripts:
      - name: Validate release configuration
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            case "$EXPENSES_TRACKER_API_URL" in
              https://*) ;;
              *) echo "error: EXPENSES_TRACKER_API_URL must be a production HTTPS origin for Release builds"; exit 1 ;;
            esac
            case "$EXPENSES_TRACKER_PUBLIC_URL" in
              https://*) ;;
              *) echo "error: EXPENSES_TRACKER_PUBLIC_URL must be a production HTTPS origin for Release builds"; exit 1 ;;
            esac
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.expensestracker.app
        INFOPLIST_FILE: ExpensesTracker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: $(EXPENSES_TRACKER_DEVELOPMENT_TEAM)
  ExpensesTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ExpensesTrackerTests]
    dependencies:
      - target: ExpensesTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ExpensesTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ExpensesTrackerUITests]
    dependencies:
      - target: ExpensesTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExpensesTracker:
    build:
      targets:
        ExpensesTracker: all
    test:
      targets: [ExpensesTrackerTests, ExpensesTrackerUITests]
